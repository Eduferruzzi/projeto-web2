<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Auto Cadastro</h1>

        <form>
            <div class="mb-3">
                <label class="form-label">CPF</label>
                <input type="text" class="form-control" [(ngModel)]="CPF" name="cpf">
            </div>

            <div class="mb-3">
                <label class="form-label">Nome</label>
                <input type="text" class="form-control" [(ngModel)]="nome" name="nome">
            </div>


            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" [(ngModel)]="email" name="email">
            </div>

            <div class="mb-3">
                <label class="form-label">Telefone</label>
                <input type="text" class="form-control" [(ngModel)]="telefone" name="telefone">
            </div>

            <h3>Endereço</h3>

            
            <div class="mb-3">
                <label class="form-label">CEP</label>
                <input type="text" class="form-control" [(ngModel)]="CEP" name="CEP">
            </div>

            <div class="mb-3">
                <label class="form-label">Logradouro</label>
                <input type="text" class="form-control" [(ngModel)]="logradouro" name="logradouro">
            </div>

            <div class="mb-3">
                <label class="form-label">Numero</label>
                <input type="text" class="form-control" [(ngModel)]="numero" name="numero">
            </div>

            <div class="mb-3">
                <label class="form-label">Complemento</label>
                <input type="text" class="form-control" [(ngModel)]="complemento" name="complemento">
            </div>

            <div class="mb-3">
                <label class="form-label">Bairro</label>
                <input type="text" class="form-control" [(ngModel)]="bairro" name="bairro">
            </div>

            <div class="mb-3">
                <label class="form-label">Cidade</label>
                <input type="text" class="form-control" [(ngModel)]="cidade" name="cidade">
            </div>

            <div class="mb-3">
                <label class="form-label">Estado</label>
                <input type="text" class="form-control" [(ngModel)]="estado" name="estado">
            </div>

            <button type="submit" class="btn btn-primary">
                Cadastrar
            </button>
        </form>
        <br>
    </div>
</body>
</html>
