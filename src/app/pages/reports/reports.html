<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h1 class="h3 text-center mb-3">Relatórios de receitas</h1>

          @if (mensagem) {
            <div class="alert alert-danger">{{ mensagem }}</div>
          }

          <div class="d-grid gap-3 col-md-8 mx-auto">
            <button
              type="button"
              class="btn btn-primary btn-lg"
              (click)="exibirDatas()"
            >
              Relatório por data
            </button>

            @if (mostrarDatas) {
              <div class="border rounded p-3">
                <div class="row g-3">
                  <div class="col-sm-6">
                    <label for="dataInicial" class="form-label">Data inicial</label>
                    <input type="date" id="dataInicial" name="dataInicial" class="form-control" #dataInicial>
                  </div>

                  <div class="col-sm-6">
                    <label for="dataFinal" class="form-label">Data final</label>
                    <input type="date" id="dataFinal" name="dataFinal" class="form-control" #dataFinal>
                  </div>
                </div>

                <div class="d-grid mt-3">
                  <button
                    type="button"
                    class="btn btn-primary"
                    (click)="baixarRelatorio('data', dataInicial.value, dataFinal.value)"
                  >
                    Baixar PDF
                  </button>
                </div>
              </div>
            }

            <button
              type="button"
              class="btn btn-outline-primary btn-lg"
              (click)="baixarRelatorio('categoria')"
            >
              Relatório por categoria
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
