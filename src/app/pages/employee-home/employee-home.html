<div class="container-fluid px-4 mt-4">
    <div class="table-responsive">
        <table class="table table-bordered mb-0">
            <thead>
                <tr class="text-white" style="background-color: #0d47a1;">
                    <th class="text-center py-3" style="color: white;">DATA/HORA</th>
                    <th class="text-center py-3" style="color: white;">CLIENTE</th>
                    <th class="text-center py-3" style="color: white;">DESCRICAO</th>
                    <th class="text-center py-3" style="color: white;">ACOES</th>
                </tr>
            </thead>

            <tbody id="tabela-solicitacoes">
                <tr *ngFor="let s of solicitacoes">
                    <td class="text-center">{{ s.dataHora }}</td>
                    <td>{{ s.cliente }}</td>
                    <td>{{ verif(s.descricaoDefeito) }}</td>
                    <td class="text-center">
                        <a [routerLink]="['/employee-quote', s.id]" class="btn btn-outline-dark btn-sm btn-orcar">Orçar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
