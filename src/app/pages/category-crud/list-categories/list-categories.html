<h1>Categorias de Equipamentos</h1>

<table class="table table-striped table-bordered table-hover">
    <tbody>
        <tr>
            <th>Nome</th>
            <th class="text-center">
                <a [routerLink]="['/categories/new']" href="#" title="Novo" alt="Novo" class="btn btn-xs btn-success">
                    <i class="fa fa-plus" aria-hidden="true"></i> Novo
                </a>
            </th>
        </tr>
        @for (category of categories; track category.id){
            <tr>
                <td>{{ category.nome }}</td>
                <td class="text-center" style="width: 300px">
                    <a [routerLink]="['/categories/edit', category.id]" href="#" title="Editar" alt="Editar" class="btn btn-xs btn-info">
                        <i class="fa fa-edit" aria-hidden="true"></i> Editar
                    </a>
                    <a href="#" title="Remover" alt="Remover" class="btn btn-xs btn-danger" (click)="remover($event, category)">
                        <i class="fa fa-times" aria-hidden="true"></i> Remover
                    </a>
                </td>
            </tr>
        }
        @empty {
            <tr>
                <td colspan="2">Nenhuma categoria cadastrada</td>
            </tr>
        }
    </tbody>
</table>
