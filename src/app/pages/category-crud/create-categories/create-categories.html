<div class="container py-4 py-md-5">
    <div class="border-bottom pb-4 mb-4">
        <p class="text-primary text-uppercase small fw-bold mb-2">Cadastro</p>
        <h1 class="h2 mb-1">Nova categoria</h1>
        <p class="text-secondary mb-0">Adicione uma categoria para organizar os equipamentos.</p>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4 p-md-5">
            <form #formCategory="ngForm">
                <div class="mb-4">
                    <label for="nome" class="form-label fw-semibold">Nome da categoria</label>
                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        [(ngModel)]="category.nome"
                        #nome="ngModel"
                        minlength="2"
                        required
                    >
                    @if (nome.errors && (nome.dirty || nome.touched)) {
                        <div class="alert alert-danger mt-2 mb-0" role="alert">
                            <div [hidden]="!nome.errors['required']">Digite o nome da categoria.</div>
                            <div [hidden]="!nome.errors['minlength']">O nome deve conter ao menos 2 caracteres.</div>
                        </div>
                    }
                </div>

                <div class="d-flex flex-column-reverse flex-sm-row justify-content-sm-end gap-2">
                    <a [routerLink]="['/categories']" class="btn btn-outline-secondary">
                        <i class="fa fa-arrow-left me-1" aria-hidden="true"></i> Voltar
                    </a>
                    <button type="button" class="btn btn-primary"
                        (click)="inserir()" [disabled]="!formCategory.form.valid">
                        <i class="fa fa-save me-1" aria-hidden="true"></i> Salvar categoria
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
