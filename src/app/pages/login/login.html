<div class="container mt-4">
    <div class="row justify-content-center">
            
            <h2 class="mb-4 text-center">Login</h2>

            
            @if (message) {
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                {{message}}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            }
            
            <form #formLogin="ngForm">
                
                <!-- email -->
                <div class="mb-4">
                    <label for="email" class="form-label">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="email@gmail.com" [(ngModel)]="login.login" #email="ngModel" required>
                    @if (email.errors && (email.dirty || email.touched)) {
                        <div class="alert alert-danger mt-2">
                            <div [hidden]="!email.errors['required']"> 
                                Digite o e-mail.
                            </div>
                        </div>
                    }
                </div>

                <!-- senha -->
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha:</label>
                    <input type="password" id="senha" name="senha" class="form-control" placeholder="Sua senha" maxlength="4" numerico [(ngModel)]="login.senha" #senha="ngModel" required>
                    @if (senha.errors && (senha.dirty || senha.touched)) {
                        <div class="alert alert-danger mt-2">
                            <div [hidden]="!senha.errors['required']"> 
                                Digite a senha.
                            </div>
                        </div>
                    }
                </div>

                <!-- botao entrar -->
                <div class="d-grid gap-2 mb-4">
                    <button 
                        type="button" 
                        class="btn btn-primary"
                        (click)="fazerLogin()"
                        [disabled]="!formLogin.form.valid"
                    >
                        <i class="fa fa-save" aria-hidden="true"></i> Entrar
                    </button>
                </div>

                
                <!-- botoes pra redirecionar -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="#" class="text-decoration-none" (click)="esqueciSenha($event)">Esqueci a senha</a>
                    <a class="text-decoration-none" [routerLink]="['/user-auto-register']">Cadastrar-se</a>
                </div>
                
            </form>
    </div>
</div>
