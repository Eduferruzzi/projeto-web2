<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>


    <h2>Login</h2>
    

    <form>
        <div>

            <label class="email">E-mail:</label><br>
            <input type="email" name="email">

        </div>

        <br>

        <div>

            <label class="senha">Senha:</label><br>
            <input type="password" name="senha">

        </div>

        <br>

        <div>
            <button type="submit">Entrar</button>
        </div>

        <br>

        <div>
            <a href="#">Esqueci a senha</a>
        </div>

        <br>

        <div>
            <a href="#">Cadastrar-se</a>
        </div>
    </form>



</body>
</html>
