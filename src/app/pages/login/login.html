<div class="container mt-4">
    <div class="row justify-content-center">
            
            <h2 class="mb-4 text-center">Login</h2>

            
            <form>
                
                <!-- email -->
                <div class="mb-4">
                    <label for="email" class="form-label">E-mail:</label>
                    <input #emailInput type="email" id="email" name="email" class="form-control" placeholder="email@gmail.com">
                </div>

                <!-- senha -->
                <div class="mb-4">
                    <label for="senha" class="form-label">Senha:</label>
                    <input #senhaInput type="password" id="senha" name="senha" class="form-control" placeholder="Sua senha" maxlength="4">
                </div>

                <!-- tipo de usuario -->
                <div class="mb-4">
                    <label class="form-label d-block">Entrar como:</label>
                    
                    <div class="form-check form-check-inline">
                        <input #tipoCliente class="form-check-input" type="radio" name="tipoUsuario" id="tipoCliente" value="cliente" checked>
                        <label class="form-check-label" for="tipoCliente">
                            Cliente
                        </label>
                    </div>
                    
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="tipoUsuario" id="tipoTrabalhador" value="trabalhador">
                        <label class="form-check-label" for="tipoTrabalhador">
                            Trabalhador
                        </label>
                    </div>
                </div>

                <!-- botao entrar -->
                <div class="d-grid gap-2 mb-4">
                    <button 
                        type="button" 
                        class="btn btn-primary"
                        (click)="fazerLogin(emailInput.value, senhaInput.value, tipoCliente.checked ? 'cliente' : 'trabalhador')"
                    >
                        Entrar
                    </button>
                </div>

                
                <!-- botoes pra redirecionar -->
                <div class="d-flex justify-content-between mt-4">
                    <a href="#" class="text-decoration-none" (click)="esqueciSenha($event)">Esqueci a senha</a>
                    <a class="text-decoration-none" [routerLink]="['/user-auto-register']">Cadastrar-se</a>
                </div>
                
            </form>
    </div>
</div>
