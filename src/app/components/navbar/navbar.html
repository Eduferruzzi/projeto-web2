<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container">

        <a
            class="navbar-brand fw-semibold"
            [routerLink]="ehFuncionario ? '/employee-home' : '/customer-home'"
        >
            Bruno Manutenções
        </a>

        <button
            class="navbar-toggler"
            type="button"
            [attr.aria-controls]="ehFuncionario ? 'menuNavbarEmployee' : 'menuNavbar'"
            [attr.aria-expanded]="menuAberto"
            aria-label="Abrir menu"
            (click)="alternarMenu()"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            [id]="ehFuncionario ? 'menuNavbarEmployee' : 'menuNavbar'"
            [class.show]="menuAberto"
        >
            <ul class="navbar-nav mx-auto">
                @if(ehFuncionario) {
                <li class="nav-item">
                    <a
                        class="nav-link"
                        routerLink="/employee-home"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }"
                    >
                        Início
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/employee-requests" routerLinkActive="active">
                        Solicitações
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/employee-crud" routerLinkActive="active">
                        Funcionários
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/categories" routerLinkActive="active">
                        Equipamentos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" routerLink="/reports" routerLinkActive="active">
                        Relatórios
                    </a>
                </li>
                } @else {
                <li class="nav-item">
                    <a
                        class="nav-link"
                        routerLink="/user-home"
                        routerLinkActive="active"
                        [routerLinkActiveOptions]="{ exact: true }"
                    >
                        Início
                    </a>
                </li>
                }
            </ul>

            <div class="d-flex align-items-center gap-3">

                @if(usuarioLogado) {
                <span class="usuario">
                    {{ usuarioLogado.nome }}
                </span>
                } @else {
                <span class="usuario">
                    Usuário
                </span>
                }

                <a class="btn btn-outline-secondary btn-sm" href="#" (click)="logout($event)">
                    Sair
                </a>

            </div>

        </div>

    </div>
</nav>
