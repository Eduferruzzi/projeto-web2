<h2 class="h5 mt-4 mb-3">Histórico da solicitação</h2>

<div class="table-responsive">
  <table class="table table-bordered align-middle">
    <thead class="table-primary">
      <tr>
        <th>Data/Hora</th>
        <th>Etapa</th>
        <th>Responsável</th>
      </tr>
    </thead>

    <tbody>
      @for (passo of historico; track $index) {
        <tr>
          <td>{{ passo.dataHora }}</td>
          <td>
            {{ descreverPasso(passo) }}

            @if (passo.observacao) {
              <div class="text-muted small">
                {{ passo.observacao }}
              </div>
            }
          </td>
          <td>{{ mostrarResponsavel(passo) }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" class="text-center text-muted">
            Nenhum histórico encontrado.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
