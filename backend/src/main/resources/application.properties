# o schema manutencao_db e criado pelo script database/script.sql.
# credenciais sao configuradas no ambiente para nao versionar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/manutencao_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# mantem o schema SQL existente sob controle do script; o Hibernate nao altera ele.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false