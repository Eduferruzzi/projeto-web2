spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:src/main/.env[.properties],optional:file:backend/src/main/.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/manutencao_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.port=8080
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:noreply@localhost}}